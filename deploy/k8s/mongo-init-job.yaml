apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-init-rs
  namespace: domain-blocks
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: mongo:latest
          command:
            - bash
            - -c
            - |
              until mongosh --host mongo-0.mongo.domain-blocks.svc.cluster.local --quiet \
                    --eval 'db.adminCommand({ping:1}).ok' | grep 1; do sleep 1; done

              mongosh --host mongo-0.mongo.domain-blocks.svc.cluster.local --quiet <<'EOF'
              try {
                rs.status();
                print("Already initialized");
              } catch(e) {
                rs.initiate({
                  _id: "rs0",
                  members: [
                    { _id: 0, host: "mongo-0.mongo.domain-blocks.svc.cluster.local:27017" },
                    { _id: 1, host: "mongo-1.mongo.domain-blocks.svc.cluster.local:27017" },
                    { _id: 2, host: "mongo-2.mongo.domain-blocks.svc.cluster.local:27017" }
                  ]
                });
                print("Initialized");
              }
              EOF
