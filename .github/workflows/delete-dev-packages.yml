name: Delete Dev Packages

on:
  workflow_dispatch:
    inputs:
      before:
        description: 'Delete dev versions with a run number below this (10 deletes everything before 2.0.0-dev.10.*)'
        required: true
        type: number
      dry_run:
        description: 'Dry run'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  delete:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OWNER: ${{ github.repository_owner }}
      BEFORE: ${{ inputs.before }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Delete versions
        run: |
          set -euo pipefail

          # The repo-scoped GITHUB_TOKEN cannot list packages at the org level,
          # so derive package names from the packable projects instead.
          packages=$(grep -l '<IsPackable>true</IsPackable>' src/*/*.csproj | xargs -n1 basename | sed 's/\.csproj$//')
          echo "Packages: $(echo "$packages" | wc -l)"

          for pkg in $packages; do
            if ! versions=$(gh api "/orgs/$OWNER/packages/nuget/$pkg/versions" --paginate --jq '.[] | "\(.id) \(.name)"'); then
              echo "$pkg: not found, skipping"
              continue
            fi
            echo "$pkg: $(echo "$versions" | grep -c .) versions"

            while read -r id name; do
              [[ -z "$name" ]] && continue
              run=$(sed -nE 's/^.*-dev\.([0-9]+)\..*$/\1/p' <<< "$name")
              [[ -z "$run" || "$run" -ge "$BEFORE" ]] && continue
              if [[ "$DRY_RUN" == "true" ]]; then
                echo "  would delete $name"
              else
                echo "  deleting $name"
                gh api -X DELETE "/orgs/$OWNER/packages/nuget/$pkg/versions/$id"
              fi
            done <<< "$versions"
          done
