version: "3.8"

services:
  mongo:
    image: mongo:6.0
    container_name: domain-blocks-mongo-rs
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    command: [ "--replSet", "rs0" ]
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 3s
      retries: 5
  
  kurrent-db:
    image: kurrentplatform/kurrentdb:25.0.1-experimental-arm64-8.0-jammy
    container_name: domain-blocks-kurrent-db
    ports:
      - "2113:2113"
    command: [ "--insecure" ]
    environment:
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=changeit

volumes:
  mongo-data:
